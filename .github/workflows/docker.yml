name: build-and-push

# 触发：推 main、打 tag、或在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  ACR_REGISTRY: crpi-jlqf5sfrp7vsp54s.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: rineyce
  ACR_REPO: spblog
  ACR_USER: ${{ secrets.ACR_USERNAME }}
  ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

jobs:
  build:
    # 固定版本而不是 ubuntu-latest：避免 2026-10 之后 latest 换到 26.04 带来意外
    runs-on: ubuntu-24.04
    # secrets 不能出现在 step 的 if 里，先落成普通环境变量
    env:
      DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: 取出源码
        uses: actions/checkout@v5

      # ---------- 计算要推送的镜像地址 ----------
      # 阿里云 ACR 是主仓库；配了 Docker Hub secrets 就顺带推一份（可选）
      - name: 计算镜像地址
        id: cfg
        run: |
          set -e
          IMAGES="${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          if [ -n "$DH_USER" ]; then
            IMAGES="${IMAGES}
          ${DH_USER}/spblog"
          fi
          echo "将会推送："
          echo "$IMAGES"
          {
            echo "images<<IMAGES_EOF"
            echo "$IMAGES"
            echo "IMAGES_EOF"
            echo "main=${ACR_REGISTRY}/${ACR_NAMESPACE}/${ACR_REPO}"
          } >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 登录 ----------
      - name: 登录阿里云 ACR
        run: |
          set -e
          echo "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" -u "$ACR_USER" --password-stdin
          echo "✔ 已登录 $ACR_REGISTRY"

      - name: 登录 Docker Hub（可选）
        if: ${{ env.DH_USER != '' }}
        run: |
          set -e
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "$DH_USER" --password-stdin

      # ---------- 标签 ----------
      # latest       : 默认分支构建
      # sha-<短哈希>  : 每个提交都有，回滚时直接指定
      # v1.2.3       : 打 tag 时
      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      # ---------- 构建（先 load 到本地，冒烟测试要用它） ----------
      - name: 构建镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # buildx 不允许 push 和 load 同时为 true，
          # 所以只构建并加载到本地，推送交给最后一步 docker push
          push: false
          load: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------- 冒烟测试：真的把容器跑起来 ----------
      # 验证：进程能启动 / 能连数据库并建表 / 前端产物在镜像里 / 健康检查通过 / 站长账号能登录
      - name: 冒烟测试（起容器 + 连数据库 + 打接口）
        env:
          IMG: ${{ steps.meta.outputs.tags }}
        run: |
          set -uo pipefail
          IMG="$(printf '%s\n' "$IMG" | head -1)"
          echo "被测镜像：$IMG"

          cleanup() {
            docker rm -f ci-app ci-pg >/dev/null 2>&1 || true
            docker network rm ci-net >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create ci-net >/dev/null

          echo "▸ 起一个临时 PostgreSQL"
          docker run -d --name ci-pg --network ci-net \
            -e POSTGRES_DB=blog -e POSTGRES_USER=blog -e POSTGRES_PASSWORD=citest \
            postgres:16-alpine >/dev/null

          for i in $(seq 1 60); do
            docker exec ci-pg pg_isready -U blog -d blog >/dev/null 2>&1 && break
            [ "$i" = 60 ] && { echo "::error::PostgreSQL 60 秒内没就绪"; docker logs ci-pg; exit 1; }
            sleep 1
          done
          echo "  PostgreSQL 就绪"

          echo "▸ 起博客容器"
          docker run -d --name ci-app --network ci-net -p 18080:8080 \
            -e PORT=8080 \
            -e STATIC_DIR=/app/dist \
            -e UPLOAD_DIR=/app/uploads \
            -e POST_CONTENT_DIR=/app/data/posts \
            -e DB_HOST=ci-pg -e DB_PORT=5432 -e DB_USER=blog -e DB_PASSWORD=citest -e DB_NAME=blog \
            -e ADMIN_USER=admin -e ADMIN_PASSWORD=ciadminpass \
            -e TZ=Asia/Shanghai \
            "$IMG" >/dev/null

          echo "▸ 等 /api/stats 返回 200"
          for i in $(seq 1 90); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/stats || true)"
            [ "$code" = "200" ] && break
            [ "$i" = 90 ] && {
              echo "::error::90 秒内接口没起来（最后状态码：$code）"
              docker logs --tail 60 ci-app
              exit 1
            }
            sleep 1
          done
          echo "  /api/stats -> $code"

          echo "▸ 断言：接口返回全站统计"
          stats="$(curl -s http://127.0.0.1:18080/api/stats)"
          echo "$stats"
          echo "$stats" | grep -q '"posts"' || { echo "::error::/api/stats 返回内容不对"; exit 1; }

          echo "▸ 断言：首页返回前端 index.html"
          html="$(curl -s http://127.0.0.1:18080/)"
          echo "$html" | head -c 300; echo
          echo "$html" | grep -q 'id="app"' || { echo "::error::首页没有返回 SPA 的 index.html"; exit 1; }

          echo "▸ 断言：容器健康状态为 healthy"
          for i in $(seq 1 60); do
            st="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' ci-app)"
            [ "$st" = "healthy" ] && break
            [ "$i" = 60 ] && { echo "::error::容器健康检查一直是 $st"; docker logs --tail 60 ci-app; exit 1; }
            sleep 1
          done
          echo "  健康状态：$st"

          echo "▸ 断言：管理员账号已自动创建"
          login_code="$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"account":"admin","password":"ciadminpass"}')"
          [ "$login_code" = "200" ] || { echo "::error::管理员登录失败（$login_code）"; docker logs --tail 60 ci-app; exit 1; }
          echo "  登录成功"

          echo "✅ 冒烟测试全部通过"

      # ---------- 推送（测试通过之后才推） ----------
      - name: 推送到阿里云 ACR
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          printf '%s\n' "$TAGS" | while IFS= read -r t; do
            [ -z "$t" ] && continue
            echo "▸ docker push $t"
            docker push "$t"
          done
          echo "✔ 镜像已推送到 ${{ steps.cfg.outputs.main }}"

      - name: 输出摘要
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### 构建 + 冒烟测试 + 推送"
            echo ''
            echo "仓库：\`${{ steps.cfg.outputs.main }}\`"
            echo ''
            echo '```'
            printf '%s\n' "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

# ============================================================
# 想更安全（推荐以后改）：把上面 env 里的账号密码删掉，换成
#
#   env:
#     ACR_USER: ${{ secrets.ACR_USERNAME }}
#     ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
#
# 然后到 Settings → Secrets and variables → Actions 里加这两个 secret。
# 同时去阿里云控制台把现在这个固定密码重置一次（它已经出现在仓库历史里了）。
# ============================================================
