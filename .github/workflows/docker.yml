name: build-and-push

# 触发：推 main、打 tag、或在 Actions 页面手动点「Run workflow」
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取出源码
        uses: actions/checkout@v4

      # ---------- 先算出要推到哪些仓库 ----------
      # 只把「配置了 secrets 的仓库」列进来：
      # 没配 Docker Hub 就只推阿里云，反之亦然；两个都没配则直接失败并说明原因。
      - name: 计算镜像仓库
        id: images
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          ALI_REG: ${{ secrets.ALIYUN_REGISTRY }}
          ALI_NS: ${{ secrets.ALIYUN_NAMESPACE }}
        run: |
          set -e
          IMAGES=""
          if [ -n "$DH_USER" ]; then
            IMAGES="${DH_USER}/simple-blog"
          fi
          if [ -n "$ALI_REG" ] && [ -n "$ALI_NS" ]; then
            IMAGES="${IMAGES:+$IMAGES
          }${ALI_REG}/${ALI_NS}/simple-blog"
          fi
          if [ -z "$IMAGES" ]; then
            echo "::error::没有配置任何镜像仓库 —— 到 Settings → Secrets and variables → Actions 添加 DOCKERHUB_USERNAME / DOCKERHUB_TOKEN（或阿里云那三个）"
            exit 1
          fi
          echo "将会推送："
          echo "$IMAGES"
          {
            echo "list<<IMAGES_EOF"
            echo "$IMAGES"
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      # ---------- 登录（没有对应 secret 时自动跳过） ----------
      - name: 登录 Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: ${{ secrets.ALIYUN_REGISTRY != '' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      # ---------- 标签 ----------
      # latest       : 默认分支构建
      # sha-<短哈希>  : 每个提交都有，回滚时直接指定
      # v1.2.3       : 打 tag 时
      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.images.outputs.list }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=tag

      # ---------- 构建并推送 ----------
      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # 服务器是 x86 云主机；要跑 ARM 就加上 linux/arm64
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          echo "### 镜像已推送 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
